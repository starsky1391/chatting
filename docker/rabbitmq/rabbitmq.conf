# RabbitMQ Configuration
# See https://www.rabbitmq.com/configure.html for details

# Listeners
listeners.tcp.default = 5672
management.tcp.port = 15672

# Load definitions at startup
load_definitions = /etc/rabbitmq/definitions.json

# Memory and disk thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.5

# Message rates
collect_statistics_interval = 5000

# Logging
log.console.level = info
log.file.level = info

# Security
loopback_users = none

# Default user (will be overridden by definitions.json)
default_user = admin
default_pass = rabbitmq123

# Policies for HA (optional, for cluster setup)
# policy.ha.mode = all
# policy.ha.sync.mode = automatic
